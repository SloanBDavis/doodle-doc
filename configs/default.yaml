# Rendering
render_dpi: 150
max_pages_per_doc: 500

# Retrieval
default_result_k: 20

# ColQwen2
colqwen_model: "vidore/colqwen2-v1.0-hf"
colqwen_batch_size: 4

# Synthetic generation
synth_model: "gemini-3.1-flash-image-preview"
synth_prompt_version: "v2"

# Evaluation
eval_regression_threshold: 0.05
